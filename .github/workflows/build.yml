name: Build Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  host-tests:
    name: PC tests (ASan/UBSan, Rust)
    runs-on: ubuntu-24.04
    # Ubuntu 26.04: GCC 15 (-std=gnu23), mbedTLS 3.6, cJSON 1.7.
    container: ubuntu:26.04
    steps:
      - name: Install packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential git ca-certificates curl python3 libmbedtls-dev libcjson-dev

      - name: Checkout
        uses: actions/checkout@v4

      # cJSON and mbedTLS headers, as in a local ~/esp/esp-idf 5.5 (ESP-IDF 6.1 has no cJSON).
      - name: ESP-IDF 5.5.2 sources
        run: |
          git clone --quiet --depth 1 --branch v5.5.2 https://github.com/espressif/esp-idf.git /opt/esp-idf-5.5
          git -C /opt/esp-idf-5.5 -c advice.detachedHead=false submodule update --quiet --init --depth 1 \
            components/json/cJSON components/mbedtls/mbedtls

      - name: Rust 1.99.1
        run: |
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Run PC tests
        env:
          IDF_PATH: /opt/esp-idf-5.5
        run: tools/ci/host-tests.sh
