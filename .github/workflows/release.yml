# Published GitHub release (pre-release or release): builds the firmware once, then
# attaches esp-miner.bin, www.bin (AxeOS OTA updates) and one factory image per board
# (bootloader + partition table + board config + firmware + www).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  assets:
    name: Release assets
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Same versions as ESP-IDF 6.1.
      - name: Install esptool and NVS generator
        run: pip install esptool==5.6.0 esp-idf-nvs-partition-gen==0.1.9

      - name: Factory images
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # merge_bin.sh calls esptool.py; esptool 5 is run as a module.
          esptool.py() { python -m esptool "$@"; }
          export -f esptool.py
          mkdir -p release
          cp build/esp-miner.bin build/www.bin release/
          for config in config-[0-9]*.cvs; do
            board="${config#config-}"; board="${board%.cvs}"
            python -m esp_idf_nvs_partition_gen generate "${config}" config.bin 0x6000 > /dev/null
            ./merge_bin.sh -c "release/esp-miner-factory-${board}-${TAG}.bin"
          done
          ls -l release

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" release/*.bin --clobber
