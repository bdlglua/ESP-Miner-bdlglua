[package]
name = "axeos-coinbase"
version = "0.1.0"
edition = "2024"
publish = false

[features]
fixed-jobs = []
asic-protocol = ["dep:bm13xx-protocol", "dep:crc"]
protocol-bench = ["asic-protocol"]

[dependencies]
bm13xx-protocol = { git = "https://github.com/GPTechinno/bm13xx-rs", rev = "422df6f1953d9fb95b5c4ab39d35b234c216d6de", optional = true }
crc = { version = "=3.4.0", optional = true }

[lib]
crate-type = ["staticlib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 2
panic = "abort"
codegen-units = 1

